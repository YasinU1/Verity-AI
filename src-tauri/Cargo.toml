[package]
name = "verity"
version = "0.1.0"
description = "Verity — real-time misinformation checker"
authors = ["Verity"]
edition = "2021"
rust-version = "1.77"

[lib]
# The Tauri mobile/desktop entrypoint lives in the lib; main.rs is a thin shim.
name = "verity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for transparent + click-through windows and for the
# private-API windowing tricks that let the HUD float over full-screen apps.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = ["full"] }
# rustls + ring: no OpenSSL, keys never leave Rust. All model/search calls happen here.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

cpal = "0.15"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
pdf-extract = "0.7"

regex = "1"
once_cell = "1"
thiserror = "2"
url = "2"

# --- AppKit private-API layer (feature-gated so `cargo test --no-default-features`
#     runs the pure logic without compiling the finicky objc2 bindings) ---
objc2 = { version = "0.5", optional = true }
objc2-app-kit = { version = "0.2", optional = true, features = [
  "NSWindow", "NSPanel", "NSScreen", "NSResponder", "NSApplication",
  "NSWorkspace", "NSRunningApplication", "NSView", "NSEvent",
] }
objc2-foundation = { version = "0.2", optional = true, features = [
  "NSString", "NSGeometry", "NSArray", "NSThread",
] }

[features]
# The native windowing/notch/frontmost-app code. On by default for the real app; turn
# it off to compile & test the pure logic quickly (and on non-macOS CI).
default = ["appkit"]
appkit = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
